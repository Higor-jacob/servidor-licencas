{% extends "base.html" %}
{% block content %}
<div class="container">
  <div class="login-card bg-dark p-4">
    <h3 class="mb-3 text-center">🔐 Central de Licenças</h3>
    <p class="text-center text-muted mb-4">Acesso restrito ao administrador</p>

    {% if erro %}
      <div class="alert alert-danger py-2">{{ erro }}</div>
    {% endif %}

    <form method="post">
      <div class="mb-3">
        <label class="form-label">Usuário</label>
        <input type="text" class="form-control" name="user" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" class="form-control" name="pwd" required>
      </div>
      <button class="btn btn-primary w-100 mt-2">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
